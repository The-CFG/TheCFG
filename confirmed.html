<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="TheCFG — 이메일 인증 완료">
    <link rel="icon" href="css/favicon.png" type="image/png">
    <title>이메일 인증 · TheCFG</title>
    <link rel="stylesheet" href="css/home/styles.css">
    <link rel="stylesheet" href="css/home/accounts.css">
    <link rel="stylesheet" href="css/home/confirmed.css">
</head>
<body>

<a class="skip-link" href="#main">본문으로 바로가기</a>

<header class="site-header">
    <a href="index.html" class="brand"><img width="20px" src="css/favicon.png" alt="(Logo)"> TheCFG</a>
    <a href="https://www.youtube.com/@TheCFG_" class="connections">YouTube</a>
    <a href="https://discord.gg/yVrDEVXEnY" class="connections">Discord</a>
    <a href="https://github.com/The-CFG" class="connections">Github</a>
    <a href="accounts.html" class="connections">계정</a>
</header>

<main id="main">
    <section class="confirm-page">

        <div id="confirm-ok" class="confirm-state" style="display:none;">
            <span class="confirm-icon confirm-icon-ok" aria-hidden="true">✓</span>
            <h1>이메일 인증 완료됨.</h1>
            <p>이제 이 창을 닫고 로그인하셔도 됩니다.</p>
        </div>

        <div id="confirm-fail" class="confirm-state" style="display:none;">
            <span class="confirm-icon confirm-icon-fail" aria-hidden="true">!</span>
            <h1>인증 링크가 유효하지 않습니다.</h1>
            <p id="confirm-fail-detail">링크가 만료되었거나 이미 사용되었을 수 있어요.</p>
            <a href="accounts.html" class="btn btn-primary">계정 페이지로 이동</a>
        </div>

        <div id="confirm-loading" class="confirm-state">
            <span class="confirm-icon confirm-icon-loading" aria-hidden="true"></span>
            <h1>확인 중...</h1>
        </div>

    </section>
</main>

<footer class="site-footer">
    <p>&copy; 2021–<span id="year">2026</span> TheCFG. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/home/confirmed.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
