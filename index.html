    <script>
    // ── OAuth 콜백 안전장치 ──────────────────────────────────
    // Supabase의 Discord 로그인은 인증 후 redirectTo로 지정한 페이지(예: /beat)로
    // 돌아가야 하지만, Supabase 대시보드의 Redirect URLs 허용 목록에 해당 주소가
    // 없으면 대시보드에 등록된 Site URL(이 홈페이지)로 강제 이동시켜버린다.
    // 이때 URL에 남아있는 인증 정보(해시의 access_token 또는 code 파라미터)를
    // 그대로 원래 목적지로 넘겨줘서, 세션이 유실되지 않고 정상적으로 로그인 상태가
    // 반영되도록 한다. (근본 해결은 Supabase 대시보드 Redirect URLs에 /beat, /hoi4
    // 등 클린 URL을 등록하는 것 — 이 스크립트는 그 전까지의 안전장치)
    (function () {
        var hasAuthCallback = location.hash.indexOf('access_token=') !== -1
            || location.search.indexOf('code=') !== -1;
        if (!hasAuthCallback) return;
        var returnTo = localStorage.getItem('thecfg_oauth_return') || '/beat';
        localStorage.removeItem('thecfg_oauth_return');
        location.replace(returnTo + location.search + location.hash);
    })();
    </script>
</head>
