[build]
  publish = "."

# 구주소(.html) → 새 클린 URL로 영구 리다이렉트 (북마크/외부 링크 호환용)
[[redirects]]
  from = "/hoi4.html"
  to = "/hoi4"
  status = 301
  force = true

[[redirects]]
  from = "/beat.html"
  to = "/beat"
  status = 301
  force = true

[[redirects]]
  from = "/limbus.html"
  to = "/limbus"
  status = 301
  force = true

[[redirects]]
  from = "/accounts.html"
  to = "/accounts"
  status = 301
  force = true

[[redirects]]
  from = "/confirmed.html"
  to = "/confirmed"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ── 보안 헤더 ────────────────────────────────────────────────────────────
# 강제 적용: nosniff / 같은 출처 외 iframe 금지 / 리퍼러 최소화(YouTube 임베드는 origin 리퍼러가 필요해서 strict-origin-when-cross-origin 유지) / 불필요한 기기 권한 차단
# CSP는 Report-Only: 막지 않고 브라우저 콘솔에 위반만 보고한다. 한동안 콘솔을 보면서 허용 도메인을 조정한 뒤
#   Content-Security-Policy-Report-Only → Content-Security-Policy 로 바꿔서 강제 적용하세요.
#   ('unsafe-inline'은 hoi4의 인라인 on* 핸들러와 인라인 <script>, 인라인 style 때문에 필요 — 나중에 줄이는 게 목표)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://i.ytimg.com https://uzokrwwzksgunrcdjlug.supabase.co; media-src 'self' blob: https://uzokrwwzksgunrcdjlug.supabase.co; connect-src 'self' https://uzokrwwzksgunrcdjlug.supabase.co wss://uzokrwwzksgunrcdjlug.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"